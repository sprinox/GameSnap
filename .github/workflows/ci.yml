name: CI

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'

    steps:
      - uses: actions/checkout@v5

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git clone -q https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout -q $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\vcpkg_installed" -ErrorAction SilentlyContinue

      - name: Restore vcpkg binaries cache
        id: vcpkg-bins
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}\vcpkg-cache
            ${{ env.VCPKG_ROOT }}\downloads
          key: vcpkg-bins-v3-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-bins-v3-${{ runner.os }}-

      - name: Restore vcpkg installed cache
        id: vcpkg-installed
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-installed-v3-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Refresh vcpkg stamp on cache hit
        shell: pwsh
        run: |
          Write-Host "binaries cache hit: ${{ steps.vcpkg-bins.outputs.cache-hit }}"
          Write-Host "installed cache hit: ${{ steps.vcpkg-installed.outputs.cache-hit }}"
          if ('${{ steps.vcpkg-installed.outputs.cache-hit }}' -eq 'true') {
            Get-ChildItem "$env:GITHUB_WORKSPACE\vcpkg_installed" -Filter '.msbuildstamp-*' -Recurse -Force -ErrorAction SilentlyContinue |
              ForEach-Object { $_.LastWriteTime = Get-Date }
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore GameSnap\packages.config -PackagesDirectory packages

      - name: Build Debug and Release x64
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "MSBuild\**\Bin\MSBuild.exe" |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          foreach ($cfg in 'Debug', 'Release') {
            & $msbuild GameSnap\GameSnap.vcxproj /m /nologo /v:minimal `
              /p:Configuration=$cfg /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              /p:EnableClangTidyCodeAnalysis=false /p:RunCodeAnalysis=false
            if ($LASTEXITCODE -ne 0) { throw "$cfg build failed" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: GameSnap-x64
          path: |
            GameSnap/x64/Debug/GameSnap.exe
            GameSnap/x64/Debug/GameSnap.pdb
            GameSnap/x64/Release/GameSnap.exe
            GameSnap/x64/Release/GameSnap.pdb
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: GameSnap-x64
          path: dist

      - name: Package
        shell: pwsh
        run: |
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z.exe' }
          foreach ($cfg in 'Debug', 'Release') {
            $dir = Get-ChildItem dist -Recurse -Directory -Filter $cfg | Select-Object -First 1
            if (-not $dir) { throw "$cfg artifacts missing" }
            & $sevenZip a -t7z -mx=9 -m0=lzma2:d=256m -mfb=273 -ms=on "GameSnap-x64-$cfg.7z" "$($dir.FullName)\*"
            if ($LASTEXITCODE -ne 0) { throw "7z $cfg failed" }
          }

      - name: Create pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "pre-${env:GITHUB_RUN_NUMBER}.${env:GITHUB_RUN_ATTEMPT}"
          $notes = "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Pre-release #$env:GITHUB_RUN_NUMBER" --notes $notes GameSnap-x64-Debug.7z GameSnap-x64-Release.7z
