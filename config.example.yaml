# GameSnap 配置示例
#
# 用法：复制本文件为 config.yaml，按需修改（config.yaml 才是程序实际加载的文件）。
# 查找顺序：--config <路径> → exe 目录\config.yaml → 当前目录\config.yaml。
# 命令行参数优先于配置文件；所有项都可省略，省略即使用默认值。
# 值非法（未知热键、类型不对等）会记录 error 并回退默认值。

# ── 输出 ────────────────────────────────────────────────────────────────────
# 截图目录；不存在会自动创建。省略 = %USERPROFILE%\Pictures\GameSnap
# output_dir: D:\GameSnapShots

# ── 编码 ────────────────────────────────────────────────────────────────────
# 编码线程数（1..8）。截图在 capture 线程串行，转换/写盘按线程并行。
encode_threads: 2

# HDR 由目标显示器动态决定；HDR 显示器保存 HDR 容器 + SDR 两份。
# format_hdr 仅支持 avif / heic / jxl；format_sdr 支持 bmp / png / jpeg / webp / avif / heic / jxl。
# 默认组合来自 docs/benchmark.md 的实测：SDR 用 JXL 无损（同体积比 WebP 快 10~20 倍、逐字节无损），
# HDR 用 AVIF（avif_speed: 10 时 4K 约 0.5 s，speed 调小只小 8% 却慢 8 倍）。
format_hdr: avif
format_sdr: jxl

# ── 编码参数 ────────────────────────────────────────────────────────────────
# PNG：compression 0..9，越大越慢、文件越小
png_compression: 6

# JPEG：quality 1..100
jpeg_quality: 95

# WebP：quality 0..100；lossless=true 时 quality 忽略；method 0..6，越大越慢
# （实测：无损时被 JXL 全面压制，仅在需要 WebP 兼容性时才用）
webp_quality: 90
webp_lossless: false
webp_method: 4

# AVIF：quality 0..100；lossless=true 时 quality 忽略；speed 0..10，越大越快
# 注意：AVIF 的“无损”只在 YUV 域成立（RGB→YCbCr 有量化损失），逐字节无损请用 JXL。
avif_quality: 90
avif_lossless: false
avif_speed: 10

# HEIC（x265）：quality 0..100；lossless=true 时 quality 忽略；
# preset: ultrafast/superfast/veryfast/faster/fast/medium/slow/slower/veryslow
# 注意：preset 只在有损模式下影响体积（veryslow 比 fast 小约 28%）；无损模式下差异 <1%。
heic_quality: 90
heic_lossless: false
heic_preset: fast

# JXL（libjxl）：distance 0..15，0 表示数学无损（还要 jxl_lossless: true），1.0 = 视觉无损
# effort 1..10，越高越慢、文件越小。默认无损 + effort 5：4K 约 8.0 MB / 5 s（基准平衡点）；
# 嫌慢改 3（1.4 s，8.7 MB），要更小改 7（11 s，7.7 MB）。
jxl_distance: 0.0
jxl_lossless: true
jxl_effort: 5

# AVIF 的 AV1 编码库：auto（libavif 自己挑）/ aom / svt
# 注意：SVT-AV1 只接受 4:2:0，会退化为色度抽样，并跳过 SDR AVIF 内嵌的 gain map
av1_encoder: auto
# 各库专属参数；-1 = 由 avif_speed 推导
aom_cpu_used: -1   # 0..8，越高越快
svt_preset: -1     # 0..13，越高越快

# YUV 色度采样（AVIF / HEIC / JPEG 生效）：auto / 444 / 422 / 420
# auto 与 444 相同（保留 UI 文字和细线）；420 文件更小但会糊掉彩色细节。
# PNG / BMP / JXL / WebP 无损走 RGB，WebP 有损固定 4:2:0，均不受此项影响。
# 无损模式（avif_lossless / heic_lossless）会强制 4:4:4，否则等于先丢色度再谈无损。
# SVT-AV1 只接受 4:2:0，选它时本项被忽略。
chroma_subsampling: auto

# HDR→SDR 色调映射算法：spline（默认，Hermite shoulder）或 analysis（调试 false color）。
tone_map: spline

# HDR→SDR 计算后端：auto（默认，优先 GPU）/ gpu / cpu。
tone_map_backend: auto

# ── 采集 ────────────────────────────────────────────────────────────────────
# 键盘热键：F1..F24 / A-Z / 0-9 / printscreen / scrolllock / insert / home / end / space / 0x7B
# 可加修饰键：ctrl / shift / alt / win，例如 ctrl+shift+F12
hotkey: F12

# true = 吞掉热键（游戏收不到这个键）；false = 游戏仍能收到
swallow: false

# 截哪块屏：primary = 主显示器；foreground = 前台窗口所在显示器
monitor: primary

# HDR 由目标显示器动态判断，无需配置。

# ── 日志 ────────────────────────────────────────────────────────────────────
# true = debug 级别日志（含每张图的排队 / 取帧 / 复制 / 转换 / 写盘耗时）
verbose: false
