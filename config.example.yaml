# GameSnap 配置示例
#
# 用法：复制本文件为 config.yaml，按需修改（config.yaml 才是程序实际加载的文件）。
# 查找顺序：--config <路径> → exe 目录\config.yaml → 当前目录\config.yaml。
# 命令行参数优先于配置文件；所有项都可省略，省略即使用默认值。
# 值非法（未知热键、类型不对等）会记录 error 并回退默认值。

# ── 输出 ────────────────────────────────────────────────────────────────────
# 截图目录；不存在会自动创建。省略 = %USERPROFILE%\Pictures\GameSnap
# output_dir: D:\GameSnapShots

# ── 编码 ────────────────────────────────────────────────────────────────────
# 编码线程数（1..8）。截图在 capture 线程串行，转换/写盘按线程并行。
encode_threads: 2

# HDR 由目标显示器动态决定；HDR 显示器保存 HDR 容器 + SDR 两份。
# format_hdr 仅支持 avif / heic；format_sdr 支持 bmp / png / jpeg / webp / avif / heic。
format_hdr: avif
format_sdr: webp

# ── 编码参数 ────────────────────────────────────────────────────────────────
# PNG：compression 0..9，越大越慢、文件越小
png_compression: 6

# JPEG：quality 1..100
jpeg_quality: 95

# WebP：quality 0..100；lossless=true 时 quality 忽略；method 0..6，越大越慢
webp_quality: 90
webp_lossless: false
webp_method: 4

# AVIF：quality 0..100；lossless=true 时 quality 忽略；speed 0..10，越大越快
avif_quality: 90
avif_lossless: false
avif_speed: 10

# HEIC（x265）：quality 0..100；lossless=true 时 quality 忽略；
# preset: ultrafast/superfast/veryfast/faster/fast/medium/slow/slower/veryslow
heic_quality: 90
heic_lossless: false
heic_preset: fast

# HDR→SDR 色调映射算法：spline（默认，Hermite shoulder）或 analysis（调试 false color）。
tone_map: spline

# HDR→SDR 计算后端：auto（默认，优先 GPU）/ gpu / cpu。
tone_map_backend: auto

# ── 采集 ────────────────────────────────────────────────────────────────────
# 键盘热键：F1..F24 / A-Z / 0-9 / printscreen / scrolllock / insert / home / end / space / 0x7B
# 可加修饰键：ctrl / shift / alt / win，例如 ctrl+shift+F12
hotkey: F12

# true = 吞掉热键（游戏收不到这个键）；false = 游戏仍能收到
swallow: false

# 截哪块屏：primary = 主显示器；foreground = 前台窗口所在显示器
monitor: primary

# HDR 由目标显示器动态判断，无需配置。

# ── 日志 ────────────────────────────────────────────────────────────────────
# true = debug 级别日志（含每张图的排队 / 取帧 / 复制 / 转换 / 写盘耗时）
verbose: false
