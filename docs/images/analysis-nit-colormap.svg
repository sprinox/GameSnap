<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" font-family="Microsoft YaHei, Segoe UI, SimHei, Noto Sans CJK SC, sans-serif">
  <rect width="1200" height="350" fill="#12141a"/>

  <text x="40" y="42" fill="#f0f3f8" font-size="19">GameSnap analysis：nit 与颜色的对应关系</text>
  <text x="40" y="70" fill="#969eaa" font-size="14">配色取自 lilium 的 ReShade HDR analysis（10000 nit 档），已按 sRGB 编码显示；横轴为对数刻度</text>

  <defs>
    <linearGradient id="ramp" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <!-- 灰阶：linear = nits/100 × 0.25，再转 sRGB -->
      <stop offset="0.0000" stop-color="#010101"/>
      <stop offset="0.4000" stop-color="#2C2C2C"/>
      <stop offset="0.5398" stop-color="#636363"/>
      <stop offset="0.5806" stop-color="#7C7C7C"/>
      <stop offset="0.6000" stop-color="#898989"/>
      <!-- 100 nit 处是硬跳变：灰 #898989 → 青 #00FFFF（代码里没有过渡带） -->
      <stop offset="0.6000" stop-color="#00FFFF"/>
      <stop offset="0.6352" stop-color="#00FFBE"/>
      <stop offset="0.6615" stop-color="#00FF00"/>
      <stop offset="0.6796" stop-color="#86FF00"/>
      <stop offset="0.7010" stop-color="#CBFF00"/>
      <stop offset="0.7204" stop-color="#FFFF00"/>
      <stop offset="0.7398" stop-color="#FFEB00"/>
      <stop offset="0.7690" stop-color="#FFBC00"/>
      <stop offset="0.8000" stop-color="#FF0000"/>
      <stop offset="0.8352" stop-color="#FF0071"/>
      <stop offset="0.8796" stop-color="#FF00BC"/>
      <stop offset="0.9204" stop-color="#FF00FF"/>
      <stop offset="0.9556" stop-color="#D500FF"/>
      <stop offset="0.9806" stop-color="#9C00FF"/>
      <stop offset="1.0000" stop-color="#0000FF"/>
    </linearGradient>
  </defs>

  <rect x="40" y="96" width="1120" height="96" fill="url(#ramp)"/>
  <rect x="40" y="96" width="1120" height="96" fill="none" stroke="#464c58" stroke-width="1"/>

  <!-- 100 nit 分界：offset 0.6 → x = 712 -->
  <line x1="712" y1="84" x2="712" y2="198" stroke="#f5f5f5" stroke-width="2"/>
  <text x="722" y="80" fill="#f5f5f5" font-size="15">100 nit 分界（硬跳变：灰 → 青）</text>

  <g fill="#e4e8f0" font-size="16" text-anchor="middle">
    <line x1="40"   y1="192" x2="40"   y2="199" stroke="#cdd2dc"/><text x="40"   y="220">0.1</text>
    <line x1="264"  y1="192" x2="264"  y2="199" stroke="#cdd2dc"/><text x="264"  y="220">1</text>
    <line x1="488"  y1="192" x2="488"  y2="199" stroke="#cdd2dc"/><text x="488"  y="220">10</text>
    <line x1="712"  y1="192" x2="712"  y2="199" stroke="#cdd2dc"/><text x="712"  y="220">100</text>
    <line x1="847"  y1="192" x2="847"  y2="199" stroke="#cdd2dc"/><text x="847"  y="220">400</text>
    <line x1="936"  y1="192" x2="936"  y2="199" stroke="#cdd2dc"/><text x="936"  y="220">1000</text>
    <line x1="1071" y1="192" x2="1071" y2="199" stroke="#cdd2dc"/><text x="1071" y="220">4000</text>
    <line x1="1160" y1="192" x2="1160" y2="199" stroke="#cdd2dc"/><text x="1160" y="220">10000</text>
  </g>
  <text x="600" y="252" fill="#969eaa" font-size="14" text-anchor="middle">亮度（nit，对数刻度）</text>

  <text x="40" y="282" fill="#b6bec4" font-size="14">灰阶：0 – 100 nit，nits/100 × 0.25 线性光再转 sRGB（0 → #010101，50 → #636363，100 → #898989）</text>
  <text x="40" y="304" fill="#b6bec4" font-size="14">彩色：100 青 → 绿(203) → 黄(400) → 红(1000) → 粉(4000) → 蓝(10000)，档间线性插值，无分级色带</text>
  <text x="40" y="326" fill="#b6bec4" font-size="14">超出范围：&gt;10000 nit 输出溢出标记（线性 6.25 红），在 UNORM 目标上被钳成纯红；&lt;0 输出深蓝</text>
</svg>
