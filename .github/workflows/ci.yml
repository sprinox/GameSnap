name: CI

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'

    steps:
      - uses: actions/checkout@v5

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git clone -q https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout -q $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\vcpkg_installed" -ErrorAction SilentlyContinue

      - name: Restore vcpkg binaries cache
        id: vcpkg-bins
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}\vcpkg-cache
            ${{ env.VCPKG_ROOT }}\downloads
          key: vcpkg-bins-v4-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-bins-v4-${{ runner.os }}-${{ env.ImageVersion }}-

      - name: Restore vcpkg installed cache
        id: vcpkg-installed
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-installed-v4-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Refresh vcpkg stamp on cache hit
        shell: pwsh
        run: |
          Write-Host "binaries cache hit: ${{ steps.vcpkg-bins.outputs.cache-hit }}"
          Write-Host "installed cache hit: ${{ steps.vcpkg-installed.outputs.cache-hit }}"
          if ('${{ steps.vcpkg-installed.outputs.cache-hit }}' -eq 'true') {
            Get-ChildItem "$env:GITHUB_WORKSPACE\vcpkg_installed" -Filter '.msbuildstamp-*' -Recurse -Force -ErrorAction SilentlyContinue |
              ForEach-Object { $_.LastWriteTime = Get-Date }
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore GameSnap\packages.config -PackagesDirectory packages

      - name: Toolchain info
        shell: pwsh
        run: |
          # vcpkg 用 vswhere -latest 选 MSVC 构建依赖，工程不写死 PlatformToolset，
          # 两边才都跟随“最新已安装”。这里把实际选中的版本打出来便于排查链接期的 STL 不匹配。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "VS: $(& $vswhere -latest -property displayName) $(& $vswhere -latest -property installationVersion)"
          }
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "MSVC toolset: $($_.Name)" }

      - name: Build Debug and Release x64
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "MSBuild\**\Bin\MSBuild.exe" |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          foreach ($cfg in 'Debug', 'Release') {
            & $msbuild GameSnap\GameSnap.vcxproj /m /nologo /v:minimal `
              /p:Configuration=$cfg /p:Platform=x64 `
              /p:WindowsTargetPlatformVersion=10.0 `
              /p:EnableClangTidyCodeAnalysis=false /p:RunCodeAnalysis=false
            if ($LASTEXITCODE -ne 0) { throw "$cfg build failed" }
          }

      - name: Package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z.exe' }
          foreach ($cfg in 'Debug', 'Release') {
            $dir = "GameSnap\x64\$cfg"
            if (-not (Test-Path "$dir\GameSnap.exe")) { throw "$cfg build output missing" }

            # OutDir 里除了 exe/pdb，还有 FxCompile 的输出（tonemap*_cs.h、*.cso）。
            # Release 只带 exe；Debug 额外带 pdb（调试用），两者都不带 .h 和 .cso。
            # 中间产物（obj/pch/iobj/sarif）在 IntDir（GameSnap\GameSnap\x64\<cfg>），本来就不在包内。
            $files = @('GameSnap.exe')
            if ($cfg -eq 'Debug') { $files += 'GameSnap.pdb' }

            $stage = Join-Path $env:RUNNER_TEMP "dist-$cfg"
            Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            foreach ($file in $files) {
              if (-not (Test-Path "$dir\$file")) { throw "${cfg}: $file missing" }
              Copy-Item "$dir\$file" $stage
            }

            $archive = Join-Path $env:GITHUB_WORKSPACE "GameSnap-x64-$cfg.7z"
            Push-Location $stage
            try {
              & $sevenZip a -t7z -mx=9 -m0=lzma2:d=256m -mfb=273 -ms=on $archive @files
              if ($LASTEXITCODE -ne 0) { throw "7z $cfg failed" }
            } finally {
              Pop-Location
            }
          }

      - name: Create pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "pre-${env:GITHUB_RUN_NUMBER}.${env:GITHUB_RUN_ATTEMPT}"
          $branch = $env:GITHUB_REF_NAME
          $title = "Pre-release #$env:GITHUB_RUN_NUMBER [$branch]"
          $notes = "Branch: $branch`nCommit: $env:GITHUB_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh release create $tag --prerelease --target $env:GITHUB_SHA --title $title --notes $notes GameSnap-x64-Debug.7z GameSnap-x64-Release.7z
