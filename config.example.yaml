# GameSnap 配置示例
#
# 用法：复制本文件为 config.yaml，按需修改（config.yaml 才是程序实际加载的文件）。
# 查找顺序：--config <路径> → exe 目录\config.yaml → 当前目录\config.yaml。
# 命令行参数优先于配置文件；所有项都可省略，省略即使用默认值。
# 值非法（未知热键、类型不对等）会整体忽略本文件并回退默认值，日志里有一条 error；
# 值非法或 YAML 语法错误会记录 error 并回退默认值。

# ── 输出 ────────────────────────────────────────────────────────────────────
# 截图目录；不存在会自动创建。省略 = %USERPROFILE%\Pictures\GameSnap
# output_dir: D:\GameSnapShots

# ── 编码 ────────────────────────────────────────────────────────────────────
# 编码线程数（1..8）。截图在 capture 线程串行，转换/写盘按线程并行。
encode_threads: 2

# ── 采集 ────────────────────────────────────────────────────────────────────
# 键盘热键：F1..F24 / printscreen / scrolllock / insert / home / end / 0x7B
hotkey: F12

# true = 吞掉热键（游戏收不到这个按键）；false = 游戏仍能收到
swallow: false

# 截哪块屏：primary = 主显示器；foreground = 前台窗口所在显示器
monitor: primary

# HDR 显示器以 FP16 捕获并色调映射到 SDR；非 HDR 显示器开启会回退 SDR 捕获
hdr: false

# ── 日志 ────────────────────────────────────────────────────────────────────
# true = debug 级别日志（含每张图的排队 / 取帧 / 拷贝 / 转换 / 写盘耗时）
verbose: false
